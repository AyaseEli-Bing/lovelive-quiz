<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>你是哪位成员？LoveLive μ's / Aqours 性格测试</title>
<meta name="description" content="选一个团体，答完一套团内情景题，测出你最像 μ's 或 Aqours 的哪位成员，并查看九人完整匹配排行。">
<link rel="stylesheet" href="./styles.css">
<script>
  (function () {
    try {
      var saved = localStorage.getItem("ll-theme");
      var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    } catch (e) {
      document.documentElement.dataset.theme = "light";
    }
  })();
</script>
</head>
<body>
<div class="stage-light" aria-hidden="true"></div>

<div class="shell">
  <header class="masthead">
    <div class="masthead-top">
      <div>
        <p class="kicker">School Idol Personality Test</p>
        <h1 class="wordmark">你是哪位成员？</h1>
      </div>
      <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false" aria-label="切换到深色模式">深色</button>
    </div>
    <p class="masthead-note">五个团体：μ's 与 Aqours 已开放，其余三团题目制作中。</p>
  </header>

  <main id="app" class="app" aria-live="polite"></main>

  <footer class="colophon">
    <p>成员资料（姓名、生日、血型、学年、应援色名、小队）依据萌娘百科条目整理，性格描述为自行改写；十六进制色值取自 LLWiki《LoveLive!系列應援色列表》。角色形象取自萌娘百科收录的官方立绘，著作权归各权利方所有。</p>
    <p>本页面为爱好者自制的非官方测试，与 LoveLive! 官方及各权利方无关，不作商业用途。标有 * 的应援色，萌娘百科条目正文与官网口径不一致，悬停可看说明。</p>
  </footer>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
